[workspace]
resolver = "2"
members = [
    "crates/rc-protocol",
    "crates/rc-agent",
    "crates/rc-bridge",
    "crates/rc-mapping",
    "crates/rc-helper",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/4fuu/remote-mic-rune"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"

[workspace]
resolver = "2"
members = [
    "crates/rc-protocol",
    "crates/rc-agent",
    "crates/rc-bridge",
    "crates/rc-mapping",
    "crates/rc-helper",
    "crates/rc-app",
]

[workspace.package]
version = "2026.1110.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/4fuu/remote-mic-rune"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Rune (GPU-rendered Rust UI). Pre-release: pinned to a commit of `dev`,
# whose history upstream keeps stable.
rune = { git = "https://github.com/anomalyco/rune", rev = "79fed3b5f1800fd031b8178172a6af7d713c9303" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "79fed3b5f1800fd031b8178172a6af7d713c9303" }

[profile.release]
lto = "thin"

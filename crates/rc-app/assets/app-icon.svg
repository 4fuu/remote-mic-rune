<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App tile in the UI's system blue: stands out on light and dark taskbars. -->
  <rect width="1024" height="1024" rx="210" fill="#2F6FED"/>

  <!-- Vertical microphone head with a cream grille: a mic first, not a menu. -->
  <rect x="362" y="100" width="300" height="360" rx="150" fill="#171A22"/>
  <rect x="412" y="180" width="200" height="18" rx="9" fill="#EDE7DC"/>
  <rect x="412" y="235" width="200" height="18" rx="9" fill="#EDE7DC"/>
  <rect x="412" y="290" width="200" height="18" rx="9" fill="#EDE7DC"/>

  <!-- Cream cradle under the head: the classic microphone stand cue. -->
  <path d="M302 390 C302 540 392 590 512 590 C632 590 722 540 722 390" fill="none" stroke="#EDE7DC" stroke-width="26" stroke-linecap="round"/>

  <!-- Handle / remote body. -->
  <rect x="392" y="400" width="240" height="500" rx="120" fill="#EDE7DC"/>

  <!-- D-pad: a bold plus with a light centre; the remote-control cue. -->
  <rect x="412" y="650" width="200" height="56" rx="28" fill="#171A22"/>
  <rect x="484" y="578" width="56" height="200" rx="28" fill="#171A22"/>
  <circle cx="512" cy="678" r="16" fill="#EDE7DC"/>

  <!-- Volume rocker. -->
  <rect x="462" y="790" width="100" height="100" rx="50" fill="#171A22"/>
  <rect x="492" y="830" width="40" height="14" rx="7" fill="#EDE7DC"/>
</svg>

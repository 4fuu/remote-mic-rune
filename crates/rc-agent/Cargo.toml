[package]
name = "rc-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Injected agent DLL for remote-mic-rune: intercepts ntdll!NtDeviceIoControlFile inside WUDFHost.exe to capture RC003 remote keys at the HID report layer."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rc-protocol = { path = "../rc-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

# Frida Gum: the Interceptor hook on ntdll!NtDeviceIoControlFile. The devkit
# ships as an MSVC static library, so the hook layer is only built with the
# MSVC toolchain (the production toolchain); see crates/rc-agent/src/hook.rs
# for the fail-open stub other Windows toolchains compile instead.
[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies]
frida-gum = { version = "=0.17.2", features = ["auto-download", "invocation-listener"] }

[package]
name = "rc-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ATVV voice bridge for remote-mic-rune: GATT session, ADPCM decode, virtual audio output."

[dependencies]
anyhow = "1"
crossbeam-queue = "0.3"
parking_lot = "0.12"
rand = "0.10"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
uuid = "1"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.18.2"
windows = { version = "0.62.2", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Storage_Streams",
    "Win32_System_Com",
] }
